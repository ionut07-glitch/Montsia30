<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Intranet</title>
    <link rel="stylesheet" href="Intranet.css">
    <link rel="stylesheet" href="estils-header-footer.css">
</head>

<body>

    <div id="header"></div>

    <div class="container">
        <div class="search-group">
            <span class="lupa">🔍</span>
            <input type="text" placeholder="Buscar empresa...">
            <button>Buscar</button>
        </div>

        <div class="select-group">
            <label for="form1">Formularis:</label>
            <select id="form1">
            <option value="digi">Respostes enquestes sobre digitalització</option>
            <option value="soste">Respostes enquestes sobre sostenibilitat</option>
        </select>
        </div>

        <div class="select-group">
            <label for="form2">Informació filtrada:</label>
            <select id="form2">
            <option value="digi_finalitzada">Empreses amb l'enquesta de digitalització finalitzada</option>
            <option value="digi_no_realitzada">Empreses amb l'enquesta de digitalització no realitzada</option>
            <option value="soste_finalitzada">Empreses amb l'enquesta de sostenibilitat finalitzada</option>
            <option value="soste_no_realitzada">Empreses amb l'enquesta de sostenibilitat no realitzada</option>
            <option value="sobre_empresa">Sobre empresa</option>
            <option value="seguiment_digi">Seguiment analític de l'avanç en digitalització</option>
            <option value="seguiment_agenda2030">Seguiment analític de l'avanç en acopilament de l'agenda 2030</option>
        </select>
        </div>
    </div>


    <div id="footer"></div>

    <script src="script.js"></script>
</body>

</html>
