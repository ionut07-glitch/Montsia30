<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link rel="stylesheet" href="Log in.css">
</head>

<body>

    <header>
        <div class="header-top">
            <img src="pictures/Logo_Logo_50anys_menut_blau.png" alt="Logo Montsia30">
            <h1>Montsia30</h1>
            <nav class="header-links">
                <a href="/index.html">Inici</a>
                <a href="/digitalització.html">Digitalització</a>
                <a href="/sostenibilitat">Sostenibilitat</a>
                <a>Intranet</a>
            </nav>
        </div>
    </header>

    <h1>Inicia sessió</h1>
    <br>
    <form onsubmit="return iniciarSessio()">

        <label for="correu">Correu electrònic:</label>
        <input type="text" id="correu" name="correu" placeholder="exemple@montsia30.net" required>
        <br>

        <label for="contrasenya">Contrasenya:</label>
        <input type="password" id="contrasenya" name="contrasenya" required>
        <br> He oblidat la meva <a href="Contrasenya.html">contrasenya</a>
        <br><br> Recordar-me <input type="checkbox" id="remember_me" name="remember_me">
        <br><br>

        <input type="submit" value="Iniciar sessió"> No tens compte? <a href="Sign in.html">Registra't</a>


    </form>

    <footer>
        <h2>©MONTSIA30 - Avinguda Catalunya n34, Amposta - 642651912 - info@insmontsia.net</h2>
        <img src="pictures/icono-removebg-preview.png" alt="Xarxes socials">
    </footer>

    <script>
        function Correu() {
            let correu = document.getElementById("correu").value;
            let domini = "@montsia30.net";

            if (!correu.endsWith(domini)) {
                alert("El domini del correu ha de ser " + domini);
                return false;
            }
            return true;
        }

        function Contrasenya() {
            let contrasenya = document.getElementById("contrasenya").value;
            let contingutcontrasenya = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[^A-Za-z0-9]).+$/;

            if (!contingutcontrasenya.test(contrasenya)) {
                alert("La contrasenya ha de tindre 8 caràcters; una majúscula, una minúscula i un caràcter especial.");
                return false;
            }
            return true;
        }

        function iniciarSessio() {
            const correu = document.getElementById("correu").value;
            const contrasenya = document.getElementById("contrasenya").value;

            if (correu === "admin@montsia30.net" && contrasenya === "Admin@1234") {
                window.location.href = "Intranet.html";
                return false;
            }

            alert("Correu o contrasenya incorrectes");
            return false;
        }
    </script>
</body>

</html>
